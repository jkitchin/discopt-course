name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      # Resolves the released discopt>=0.9 from PyPI (no [tool.uv.sources]
      # pin) plus the dev group. Testing against discopt `main` is the job of
      # discopt-integration.yml.
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/ -q
