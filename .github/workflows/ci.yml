name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      # Resolves discopt from its git `main` via [tool.uv.sources] (the course
      # currently tracks main; this compiles discopt's Rust core, which the
      # runner's preinstalled Rust toolchain handles) plus the dev group.
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/ -q
